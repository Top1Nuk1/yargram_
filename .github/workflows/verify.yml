name: verify

# Проверка перед сборкой: типы, линтер и все тесты (web + server + landing).
# Запускается на каждый push в main и на pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # YARGRAM_INSTALLING=1 гасит собственный install-скрипт проекта
      # (scripts/install-workspaces.mjs), иначе `npm ci` попытался бы
      # рекурсивно вызвать `npm install` ещё раз.
      - name: Install dependencies
        run: npm ci
        env:
          YARGRAM_INSTALLING: '1'

      - name: Typecheck, lint and tests
        run: npm run verify
